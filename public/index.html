<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SECURITE : Empêche les moteurs de recherche d'indexer le site -->
    <meta name="robots" content="noindex, nofollow">
    <title>Standex Laser Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <!-- ECRAN DE CONNEXION (Nouveau) -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-sm w-full p-8 shadow-2xl text-center">
            <div class="mb-6">
                <!-- Logo Standex -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Standex_International_logo.svg/1280px-Standex_International_logo.svg.png" 
                     alt="Standex Engraving Logo" class="mx-auto h-10 w-auto">
            </div>
            
            <h2 class="text-xl font-extrabold text-slate-800 uppercase tracking-wide mb-1">Restricted Access</h2>
            <p class="text-xs text-slate-500 mb-6">Enter password to access the Laser Schedule</p>
            
            <form onsubmit="checkPassword(event)" class="space-y-4">
                <input type="password" id="site-password" placeholder="Password..." required 
                    class="w-full p-3 bg-slate-50 border border-slate-300 rounded text-slate-900 text-center text-sm focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600">
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white p-3 rounded font-bold text-sm uppercase tracking-wider transition shadow-lg">
                    Unlock
                </button>
                <p id="auth-error" class="text-xs text-red-500 hidden font-semibold mt-2">Incorrect password.</p>
            </form>
        </div>
    </div>

    <!-- CONTENU PRINCIPAL (Votre code précédent) -->
    <div id="main-content" class="hidden">
        <!-- INSÉREZ TOUT VOTRE CODE DE PLANNING PRÉCÉDENT ICI -->
        <!-- Exemple : <header>...</header> <main>...</main> <footer>...</footer> -->
        
        <div class="p-8">
            <h1 class="text-3xl font-bold mb-4">Laser Production Schedule</h1>
            <!-- Votre tableau ou application Standex doit se trouver ici -->
        </div>
    </div>

    <script>
        // MOT DE PASSE (Changez-le ici)
        const SITE_PASSWORD = "laser2026";

        function checkPassword(event) {
            event.preventDefault();
            const input = document.getElementById('site-password').value;
            const authScreen = document.getElementById('auth-screen');
            const mainContent = document.getElementById('main-content');
            const errorText = document.getElementById('auth-error');

            if (input === SITE_PASSWORD) {
                // Cache l'écran de connexion et affiche le contenu
                authScreen.classList.add('hidden');
                mainContent.classList.remove('hidden');
            } else {
                errorText.classList.remove('hidden');
                document.getElementById('site-password').value = '';
            }
        }
    </script>
</body>
</html>
