<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Standex Laser Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans">

    <!-- 1. AUTH SCREEN -->
    <div id="auth-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:9999; display:flex; align-items:center; justify-content:center; text-align:center;">
        <div style="width: 300px; margin: auto;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Standex_International_logo.svg/1280px-Standex_International_logo.svg.png" style="width:150px; margin-bottom:20px; margin-left:auto; margin-right:auto;">
            <h2 style="margin-bottom:5px; font-size: 20px; font-weight: bold;">Restricted Access</h2>
            <p style="font-size:12px; color:#94a3b8; margin-bottom:20px;">Enter password to access the Laser Schedule</p>
            <input type="password" id="site-password" placeholder="Password..." style="width:100%; padding:10px; color:black; border-radius:5px; border:none; margin-bottom:10px;">
            <button onclick="checkPassword()" style="width:100%; padding:10px; background:#dc2626; color:white; border:none; border-radius:5px; cursor:pointer; font-weight: bold;">Unlock</button>
            <p id="auth-error" style="color:red; font-size:12px; margin-top:10px; display:none;">Incorrect password.</p>
        </div>
    </div>

    <!-- 2. MAIN CONTENT -->
    <div id="main-content" style="display:none;" class="p-6 max-w-7xl mx-auto">
        
        <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <h1 class="text-2xl font-bold tracking-wide">Standex Engraving - Laser Schedule</h1>
            
            <div class="flex items-center gap-3">
                <label class="text-xs font-bold text-gray-400 uppercase">Filter Mapping:</label>
                <select id="filter-mapping" onchange="filterByMapping()" class="p-2 bg-slate-900 border border-slate-700 rounded text-white text-sm">
                    <option value="all">All Mappings</option>
                    <option value="valid">Validated Only</option>
                    <option value="invalid">Invalid Only</option>
                    <option value="pending">Pending Only</option>
                    <option value="none">Not Done Only</option>
                </select>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-900 p-6 rounded-xl border border-slate-800 mb-8">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase">Priority</label>
                <select id="priority" class="w-full mt-1 p-2.5 bg-slate-950 border border-slate-700 rounded text-white">
                    <option value="yellow">🟡 Standard</option>
                    <option value="red">🔴 Critical</option>
                    <option value="green">🟢 Low</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase">Mapping Status</label>
                <select id="mapping-status" class="w-full mt-1 p-2.5 bg-slate-950 border border-slate-700 rounded text-white">
                    <option value="none">Not Done</option>
                    <option value="pending">Done (Pending Validation)</option>
                    <option value="valid">Done & Validated</option>
                    <option value="invalid">Done & Invalid</option>
                </select>
            </div>

            <div class="flex items-end">
                <button onclick="updateMoldDetails()" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded transition">Update / Save Mold</button>
            </div>
        </div>

        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
            <h3 class="text-sm font-bold text-slate-400 uppercase mb-4">Mold Details Overview</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <span class="text-gray-400 block font-bold uppercase text-xs">Grain</span>
                    <span id="lb-grain" class="text-white font-bold text-sm">Texture 01</span>
                </div>
                <div>
                    <span class="text-gray-400 block font-bold uppercase text-xs">Priority</span>
                    <span id="lb-priority" class="font-bold text-sm"></span>
                </div>
                <div>
                    <span class="text-gray-400 block font-bold uppercase text-xs">Mapping</span>
                    <span id="lb-mapping" class="font-bold text-sm"></span>
                </div>
                <div>
                    <span class="text-gray-400 block font-bold uppercase text-xs">Calendar Badge</span>
                    <div id="calendar-badge-container" class="mt-1"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SITE_PASSWORD = "laser2026";

        function checkPassword() {
            if (document.getElementById('site-password').value === SITE_PASSWORD) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('auth-error').style.display = 'block';
                document.getElementById('site-password').value = '';
            }
        }

        function updateMoldDetails() {
            // 1. Priority Logic
            const pVal = document.getElementById('priority').value;
            const pSpan = document.getElementById('lb-priority');
            
            if (pVal === "yellow") { pSpan.textContent = "Standard"; pSpan.className = "font-bold text-sm text-amber-500"; }
            else if (pVal === "red") { pSpan.textContent = "Critical"; pSpan.className = "font-bold text-sm text-red-500"; }
            else { pSpan.textContent = "Low"; pSpan.className = "font-bold text-sm text-green-500"; }

            // 2. Mapping Logic
            const mVal = document.getElementById('mapping-status').value;
            const mSpan = document.getElementById('lb-mapping');
            const badge = document.getElementById('calendar-badge-container');

            if (mVal === "valid") {
                mSpan.textContent = "Validated"; mSpan.className = "font-bold text-sm text-green-500";
                badge.innerHTML = '<span class="px-1.5 py-0.5 text-[10px] bg-green-500/20 text-green-400 rounded font-bold">Mapping: Valid</span>';
            } else if (mVal === "invalid") {
                mSpan.textContent = "Invalid"; mSpan.className = "font-bold text-sm text-red-500";
                badge.innerHTML = '<span class="px-1.5 py-0.5 text-[10px] bg-red-500/20 text-red-400 rounded font-bold">Mapping: Invalid</span>';
            } else if (mVal === "pending") {
                mSpan.textContent = "Done (Pending)"; mSpan.className = "font-bold text-sm text-amber-500";
                badge.innerHTML = '<span class="px-1.5 py-0.5 text-[10px] bg-amber-500/20 text-amber-400 rounded font-bold">Mapping: Pending</span>';
            } else {
                mSpan.textContent = "Not Done"; mSpan.className = "font-bold text-sm text-slate-400";
                badge.innerHTML = '<span class="px-1.5 py-0.5 text-[10px] bg-slate-800 text-slate-400 rounded font-bold">Mapping: None</span>';
            }
        }

        function filterByMapping() { /* Logique de filtre à lier à votre liste */ }

        window.onload = updateMoldDetails;
    </script>
</body>
</html>
